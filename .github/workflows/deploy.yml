name: Build and deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Every morning (08:00 Bishkek) pull client prices from the Google workbook.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      allow_big_change:
        description: 'Accept price changes over 30% (after checking the workbook)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels the one in progress.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Published CSV of the «Сайт» sheet (client prices only). Empty = no sync.
  PRICES_CSV_URL: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.go.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Scheduled / manual runs: copy prices from the workbook into
      # data/tours.json and commit them, so every change is in the git history.
      - id: sync
        if: github.event_name != 'push'
        shell: bash  # pipefail: a failed sync fails the step despite tee
        env:
          ALLOW_BIG_CHANGE: ${{ inputs.allow_big_change && '1' || '0' }}
        run: node scripts/sync-prices.js | tee sync.log && grep '^changed=' sync.log >> "$GITHUB_OUTPUT"

      - if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'price-sync'
          git config user.email 'price-sync@users.noreply.github.com'
          git commit -am 'Prices from the calculation workbook'
          git push

      # A scheduled run with no price change has nothing to publish.
      - id: go
        run: echo "deploy=${{ github.event_name != 'schedule' || steps.sync.outputs.changed == 'true' }}" >> "$GITHUB_OUTPUT"

      - if: steps.go.outputs.deploy == 'true'
        run: npm ci

      # Resized/encoded images are keyed by content hash, so only new or
      # changed photos get re-encoded on each run.
      - if: steps.go.outputs.deploy == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/images
          key: images-${{ hashFiles('assets/images/**') }}
          restore-keys: images-

      - if: steps.go.outputs.deploy == 'true'
        run: npm run build

      - if: steps.go.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
